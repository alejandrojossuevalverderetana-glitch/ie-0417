name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'semanas/semana12/CalculatorTests/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'semanas/semana12/CalculatorTests/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up CMake
        uses: lukka/get-cmake@v3.21.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtest-dev

      - name: Build and run tests
        run: |
          mkdir -p build
          cd build
          cmake ../semanas/semana12/CalculatorTests
          make
          ./test_calculator

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to production
        run: |
          echo "Deploying to production server"
